:root[data-theme="dark"] { --pg-bg: #090e19; --pg-panel: #121a2c; --pg-ink: #eef2f8; --pg-muted: #a3aeca; --pg-line: #26324d; --pg-accent: #4fd8c8; --pg-accent-tint: #0f3a3a; --pg-navy: #c9d2e6; --pg-stage: #0d1424; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--pg-bg); color: var(--pg-ink); font-family: var(--pg-font); font-size: 14px; }
.pg { min-height: 100%; display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 24px; gap: 12px; box-sizing: border-box; }
.pg-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.pg-brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; letter-spacing: -0.02em; color: var(--pg-navy); margin: 0; }

.seg button:focus-visible, .pg-btn:focus-visible, .ix a:focus-visible, .nt a:focus-visible, .nt button:focus-visible { outline: 2px solid var(--pg-accent); outline-offset: 2px; }
.pg-main { display: grid; grid-template-columns: 250px minmax(0, 1fr) 290px; gap: 16px; align-items: start; flex: 1; }
.ix, .nt { background: var(--pg-panel); border: 1px solid var(--pg-line); border-radius: 14px; padding: 14px; min-width: 0; }
.ix { position: sticky; top: max(12px, env(safe-area-inset-top, 0px)); max-height: calc(100vh - 100px); overflow: auto; }
.ix h2, .nt h2 { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--pg-muted); margin: 14px 0 6px; font-weight: 700; }
.ix h2:first-child { margin-top: 0; }

.nt .states button { border: 1px solid var(--pg-line); background: var(--pg-panel); color: var(--pg-ink); font: 600 12.5px var(--pg-font); border-radius: 999px; padding: 4px 10px; min-height: 32px; cursor: pointer; }
.nt .states button[aria-pressed="true"] { background: var(--pg-accent-tint); border-color: var(--pg-accent); }

.app[data-cur="INR"] .c-AED, .app[data-cur="INR"] .c-USD, .app[data-cur="AED"] .c-INR, .app[data-cur="AED"] .c-USD, .app[data-cur="USD"] .c-INR, .app[data-cur="USD"] .c-AED { display: none; }
.nt .flow { font-family: var(--pg-mono); font-size: 11.5px; color: var(--pg-accent); margin-bottom: 6px; }
.nt .nav-row { display: flex; gap: 8px; margin-top: 14px; }
.pg-main.wide { grid-template-columns: 230px minmax(0, 1fr); } .pg-main.wide .nt { grid-column: 1 / -1; }
@media (max-width: 1180px) { .pg-main { grid-template-columns: 230px minmax(0, 1fr); } .nt { grid-column: 1 / -1; } }
@media (max-width: 760px) { .pg-main, .pg-main.wide { grid-template-columns: minmax(0, 1fr); } .ix { position: static; max-height: none; padding: 10px; } .ix nav { display: none; } .ix-select { display: block; } .stage { padding: 10px; } .pg-ctrls { margin-left: 0; } }

  var stageEl = document.getElementById('stage'), scaler = document.getElementById('scaler'), notesEl = document.getElementById('notes');

  function tabbar(sel) {
    var t = [['home', 'Home', 'home'], ['plus', 'Create', 'create'], ['cal', 'Calendar', 'calendar'], ['inbox', 'Inbox', 'inbox'], ['earn', 'Earn', 'earn']];
    return '<nav class="tabbar" role="tablist" aria-label="Main">' + t.map(function (x) { return '<button class="tb' + (x[1] === 'Create' ? ' cr' : '') + '" role="tab" aria-selected="' + (sel === x[1]) + '" data-go="' + x[2] + '"><span class="pill">' + ic(x[0]) + '</span>' + x[1] + '</button>'; }).join('') + '</nav>';
  }
  function side(sel) {
    var a = [['home', 'Home', 'home'], ['plus', 'Create', 'create'], ['film', 'My reels', 'reels'], ['cal', 'Calendar', 'calendar'], ['inbox', 'Inbox', 'inbox', '3'], ['earn', 'Earn', 'earn'], ['chart', 'Insights', 'insights']];
    var b = [['palette', 'Brand kit', 'brandkit'], ['book', 'Creator school', 'learn'], ['user', 'Account', 'account']];
    function n(x) { return '<button class="nv" data-go="' + x[2] + '"' + (sel === x[1] ? ' aria-current="page"' : '') + '>' + ic(x[0]) + x[1] + (x[3] ? '<span class="cnt">' + x[3] + '</span>' : '') + '</button>'; }
    return '<aside class="side"><div class="brand" data-go="home">' + LOGO(30) + 'reelkar</div>' + a.map(n).join('') + '<p class="t-over grp">Grow</p>' + b.map(n).join('') +
      '<div class="card flat" style="margin-top:auto;gap:8px"><span class="credits">' + ic('spark', 1) + '26 credits</span><p class="t-cap">Free plan · 3 reels left this week</p>' + btn('Get more', { k: 's', sm: 1, go: 'credits' }) + '</div></aside>';
  }
  function frame() {
    var s = R[cur], c = { desk: dev === 'desk', state: state };
    var inner = s.r(c);
    var html;
    if (dev === 'phone') {
      var showTabs = s.chrome !== 'onb' && s.chrome !== 'splash' && !s.back;
      html = '<div class="app phone" data-cur="INR" data-t="' + theme + '"><div class="sb-status"><span class="mono" style="font-size:12px">9:41</span><span>5G ▮▮▮</span></div><div class="body" id="appbody">' + inner + '</div>' + (showTabs ? tabbar(s.tab) : '') + '</div>';
    } else if (s.chrome === 'splash') {
      html = '<div class="app desk" data-cur="INR" data-t="' + theme + '">' + inner + '</div>';
    } else if (s.chrome === 'onb') {
      html = '<div class="app desk" data-cur="INR" data-t="' + theme + '"><div class="onb-desk"><div class="top">' + LOGO(30) + 'reelkar</div><div class="mid" id="appbody"><div class="panel">' + inner + '</div></div></div></div>';
    } else {
      var nav = s.nav || s.tab || 'Home';
      html = '<div class="app desk" data-cur="INR" data-t="' + theme + '">' + side(nav) + '<div class="desk-main"><header class="topbar"><button class="search" data-toast="Search opens here (Ctrl+K)">' + ic('search', 1) + 'Search reels, ideas, lessons<span class="kbd">Ctrl K</span></button><span style="margin-left:auto"></span>' + CREDITS + '<button class="iconbtn" data-go="notifications" aria-label="Notifications">' + ic('bell') + '<span class="n"></span></button>' + btn('New reel', { sm: 1, go: 'create', i: 'plus' }) + '<button class="av" data-go="account" aria-label="Account">P</button></header><div class="body" id="appbody"><div class="content">' + inner + '</div></div></div></div>';
    }
    scaler.innerHTML = html;
    fit();
    var b = document.getElementById('appbody'); if (b) b.scrollTop = 0;
  }
  function fit() {
    var w = dev === 'phone' ? 375 : 1280, h = 780;
    var avail = stageEl.clientWidth - (window.innerWidth < 760 ? 20 : 40);
    var k = Math.min(1, avail / w);
    scaler.style.transform = 'scale(' + k + ')';
    scaler.style.width = w + 'px';
    scaler.style.height = h + 'px';
    scaler.style.marginRight = (w * k - w) + 'px';
    scaler.style.marginBottom = (h * k - h) + 'px';
  }
  function notes() {
    var s = R[cur], f = FLOWS.filter(function (x) { return x[0] === s.f; })[0];
    var targets = []; scaler.querySelectorAll('.body [data-go]').forEach(function (el) { var g = el.getAttribute('data-go'); if (R[g] && g !== cur && targets.indexOf(g) < 0) targets.push(g); });
    var st = ['default'].concat(s.states || []);
    var live = ORDER.filter(function (id) { return !R[id].dep || id === cur; }), idx = live.indexOf(cur), prev = live[idx - 1], next = live[idx + 1];
    notesEl.innerHTML = '<p class="flow">' + f[0] + ' · ' + f[1] + '</p><h1>' + s.t + '</h1>' + (s.dep ? '<p class="dep-note">' + s.dep + '</p>' : '') + '<p>' + s.notes + '</p>' +
      '<h2>States</h2><div class="states">' + st.map(function (x) { return '<button data-pstate="' + x + '" aria-pressed="' + (state === x) + '">' + x.charAt(0).toUpperCase() + x.slice(1) + '</button>'; }).join('') + '</div>' +
      '<h2>Buttons here lead to</h2><ul>' + (targets.length ? targets.map(function (t) { return '<li><a href="#' + t + '">' + R[t].t + '</a></li>'; }).join('') : '<li>Actions on this screen show a confirmation instead of moving on.</li>') + '</ul>' +
      '<div class="nav-row">' + (prev ? '<a class="pg-btn" style="display:inline-flex;align-items:center;text-decoration:none" href="#' + prev + '">← ' + R[prev].t + '</a>' : '') + (next ? '<a class="pg-btn" style="display:inline-flex;align-items:center;text-decoration:none" href="#' + next + '">' + R[next].t + ' →</a>' : '') + '</div>';
  }
  function index() {
    var nav = '', sel = '';
    FLOWS.forEach(function (f) {
      nav += '<h2>' + f[0] + ' · ' + f[1] + '</h2>'; sel += '<optgroup label="' + f[0] + ' · ' + f[1] + '">';
      ORDER.forEach(function (id, i) { if (R[id].f !== f[0]) return; nav += '<a href="#' + id + '"' + (id === cur ? ' aria-current="page"' : '') + (R[id].dep ? ' class="dep"' : '') + '><span>' + String(i + 1).padStart(2, '0') + '</span>' + R[id].t + (R[id].dep ? ' <em>Replaced</em>' : '') + '</a>'; sel += '<option value="' + id + '"' + (id === cur ? ' selected' : '') + '>' + String(i + 1).padStart(2, '0') + ' ' + R[id].t + (R[id].dep ? ' (replaced)' : '') + '</option>'; });
      sel += '</optgroup>';
    });
    document.getElementById('ix-nav').innerHTML = nav; document.getElementById('ix-select').innerHTML = sel;
  }
  function render() { document.querySelector('.pg-main').classList.toggle('wide', dev === 'desk'); frame(); notes(); index(); syncCtrls(); }
  function go(id) { if (!R[id]) return; if (id === cur) { state = 'default'; render(); return; } location.hash = id; }
  function route() { var h = location.hash.replace('#', ''); cur = R[h] ? h : 'splash'; state = 'default'; render(); }
  function toast(t) {
    var app = scaler.querySelector('.app'); if (!app) return;
    var old = app.querySelector('.toast'); if (old) old.remove();
    var d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = t; app.appendChild(d);
    clearTimeout(toastT); toastT = setTimeout(function () { d.remove(); }, 1800);
  }
  function syncCtrls() {
    document.getElementById('dev-phone').setAttribute('aria-pressed', dev === 'phone'); document.getElementById('dev-desk').setAttribute('aria-pressed', dev === 'desk');
    document.getElementById('th-light').setAttribute('aria-pressed', theme === 'light'); document.getElementById('th-dark').setAttribute('aria-pressed', theme === 'dark');
  }
  function save() { try { localStorage.setItem('rk-dev', dev); localStorage.setItem('rk-theme', theme); } catch (e) {} }

  scaler.addEventListener('click', function (e) {
    var el = e.target.closest('[data-go],[data-toast],[data-set-state],.chip,.sw,.chk,[role="tab"],[data-pick]');
    if (!el || !scaler.contains(el)) return;
    if (el.matches('.chip[data-group]')) {
      var g = el.getAttribute('data-group');
      if (el.hasAttribute('data-multi')) el.setAttribute('aria-pressed', el.getAttribute('aria-pressed') !== 'true');
      else el.parentNode.querySelectorAll('.chip[data-group="' + g + '"]').forEach(function (x) { x.setAttribute('aria-pressed', x === el); });
    }
    if (el.matches('[role="tab"][data-group]')) { el.parentNode.querySelectorAll('[role="tab"]').forEach(function (x) { x.setAttribute('aria-selected', x === el); }); var ca = document.getElementById('cap'); if (ca && el.dataset.cap) ca.value = el.dataset.cap; }
    if (el.matches('.sw')) el.setAttribute('aria-checked', el.getAttribute('aria-checked') !== 'true');
    if (el.matches('.chk')) { var on = el.getAttribute('aria-checked') !== 'true'; el.setAttribute('aria-checked', on); el.innerHTML = on ? ic('check', 1) : ''; el.closest('.lrow').classList.toggle('done', on); }
    if (el.matches('[data-pick]')) { el.parentNode.querySelectorAll('[data-pick]').forEach(function (x) { x.style.border = x === el ? '2px solid var(--teal-text)' : ''; x.setAttribute('aria-checked', x === el); }); }
    if (el.hasAttribute('data-cur')) el.closest('.app').setAttribute('data-cur', el.getAttribute('data-cur'));
    if (el.hasAttribute('data-toast')) toast(el.getAttribute('data-toast'));
    if (el.hasAttribute('data-set-state')) { state = el.getAttribute('data-set-state'); frame(); notes(); }
    if (el.hasAttribute('data-go')) go(el.getAttribute('data-go'));
  });
  scaler.addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="link"][data-go]')) { e.preventDefault(); go(e.target.getAttribute('data-go')); } });
  notesEl.addEventListener('click', function (e) { var b = e.target.closest('[data-pstate]'); if (!b) return; state = b.getAttribute('data-pstate'); frame(); notes(); });
  document.getElementById('ix-select').addEventListener('change', function (e) { go(e.target.value); });
  document.getElementById('dev-phone').onclick = function () { dev = 'phone'; save(); render(); };
  document.getElementById('dev-desk').onclick = function () { dev = 'desk'; save(); render(); };
  document.getElementById('th-light').onclick = function () { theme = 'light'; save(); render(); };
  document.getElementById('th-dark').onclick = function () { theme = 'dark'; save(); render(); };
  document.getElementById('restart').onclick = function () { go('welcome'); };
  window.addEventListener('hashchange', route);
  window.addEventListener('resize', fit);
  route();
})();
</script>
